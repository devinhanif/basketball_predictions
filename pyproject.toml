[project]
name = "nba-prediction"
version = "0.1.0"
description = "Possession-level NBA prediction and backtest pipeline (local, cheapest-possible stack)."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "duckdb>=1.0,<2.0",
  "polars>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.11,<2.0",
  "scikit-learn>=1.4,<2.0",
  "statsmodels>=0.14,<1.0",
  "lightgbm>=4.3,<5.0",
  "torch>=2.2,<3.0",
  "nba_api>=1.4,<2.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "pyarrow>=16.0",
  "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "hypothesis>=6.100,<7.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=3.7,<4.0",
  "types-pyyaml>=6.0,<7.0",
]
llm = [
  "anthropic>=1.13.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nba*", "research*"]

[tool.pytest.ini_options]
addopts = "--cov=nba --cov=research --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
markers = [
  "slow: takes more than about 10 s (training loops, large fixtures, subprocess replays); excluded by `make test-fast` (-m 'not slow'), included by `make test`",
]

[tool.coverage.run]
source = ["nba", "research"]
branch = true
# Archived Colab job scripts run only on the Colab VM (Devin, 2026-10-12).
omit = ["research/colab/jobs/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["nba", "research", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

# Frozen-evidence scripts: preregs (docs/prereg/LINE_MOVE_TOWARD_MODEL*.md, STAR_FLOOR_PAPER.md)
# cite these by path as the run that produced a gate result. They are left byte-identical; lint
# is silenced per file with the exact codes found on 2026-11-16 (none of them can hide a bug that
# changes a result: layout, one-liners, import order, open() without a context manager).
[tool.ruff.lint.per-file-ignores]
"research/scratch/gate_line_move_fav_dip_2026_10_21.py" = ["E401", "E501", "E701", "E702", "E703", "E731", "I001", "UP017", "B007", "B905", "SIM115"]
"research/scratch/star_floor_gate_2026_10_21.py" = ["E401", "E501", "E701", "E702", "E703", "E731", "I001", "UP017", "B007", "B905", "SIM115"]
"research/scratch/gate_line_move_dnp_fair_2026_10_23.py" = ["E401", "E501", "E701", "E702", "E703", "E731", "I001", "UP017", "B007", "B905", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["nba", "research"]

[tool.ruff.format]
# Same three frozen-evidence scripts as the per-file-ignores above: not reformatted.
exclude = [
  "research/scratch/gate_line_move_fav_dip_2026_10_21.py",
  "research/scratch/star_floor_gate_2026_10_21.py",
  "research/scratch/gate_line_move_dnp_fair_2026_10_23.py",
]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Match the interpreter mypy runs under (3.12). Required so third-party stubs
# (e.g. numpy>=2.5) that use 3.12 `type` syntax parse. Runtime floor stays 3.11+.
python_version = "3.12"
files = ["nba", "research"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "nba.registry.*"
strict = true

# research/ keeps the strictness its modules had under nba/ (registry.routing, parlay.totals_poisson)
[[tool.mypy.overrides]]
module = "research.registry.*"
strict = true

[[tool.mypy.overrides]]
module = "research.parlay.*"
strict = true

[[tool.mypy.overrides]]
module = "nba.datamanifest.*"
strict = true

[[tool.mypy.overrides]]
module = "nba.parlay.*"
strict = true

[[tool.mypy.overrides]]
module = "nba.kalshi.*"
strict = true

[[tool.mypy.overrides]]
module = "nba.markets.*"
strict = true

# Frozen-evidence scripts cited by path in preregs (see [tool.ruff.lint.per-file-ignores]); untouched.
[[tool.mypy.overrides]]
module = [
  "research.scratch.gate_line_move_fav_dip_2026_10_21",
  "research.scratch.star_floor_gate_2026_10_21",
  "research.scratch.gate_line_move_dnp_fair_2026_10_23",
]
ignore_errors = true
