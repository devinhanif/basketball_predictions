[project]
name = "nba-prediction"
version = "0.1.0"
description = "Possession-level NBA prediction and backtest pipeline (local, cheapest-possible stack)."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "duckdb>=1.0,<2.0",
  "polars>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.11,<2.0",
  "scikit-learn>=1.4,<2.0",
  "statsmodels>=0.14,<1.0",
  "lightgbm>=4.3,<5.0",
  "torch>=2.2,<3.0",
  "nba_api>=1.4,<2.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "hypothesis>=6.100,<7.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=3.7,<4.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nba*"]

[tool.pytest.ini_options]
addopts = "--cov=nba --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
source = ["nba"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["nba", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["nba"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["nba"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "nba.registry.*"
strict = true

[[tool.mypy.overrides]]
module = "nba.parlay.*"
strict = true

[[tool.mypy.overrides]]
module = "nba.kalshi.*"
strict = true
