name: rung4_stepheads
description: >
  Rung-4 possession-outcome step heads (outcome/zone/make/rebound/duration) trained on a
  Colab GPU. Holdout scoring is OFF: the 2025 holdout is already spent and the model was
  decided rejected, so the staged notebook copy forces NBA_SCORE_HOLDOUT=False. The
  original notebook default (True) is untouched.
notebook: nba/models/colab/rung4_stepheads.ipynb
inputs:
  - path: data/colab/possession_steps.parquet
    produce: >
      uv run python -m nba.models.colab.export_training_data
      --db nba/db/nba.duckdb --out data/colab/possession_steps.parquet
    depends_on: [nba/db/nba.duckdb]
artifacts: [weights.pt, config.json, metrics.json]
registry:
  model_name: rung4_stepheads
  tags: {rung: 4, model_method: stepheads, holdout_scored: false}
touches_holdout: false
preregistration_id: null
