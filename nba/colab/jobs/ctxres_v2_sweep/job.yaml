name: ctxres_v2_sweep
description: >
  Context-residual v2 model-family sweep on a Colab T4 (single NBA_BUDGET knob: fast default
  targets 15-20 min, unmeasured; full ~45-60 min). Arms: production-config LightGBM (v1_prod),
  XGBoost residual (v1 / v1+v2 features, production config vs Optuna-tuned), season-relative and
  pruned feature variants, multi-quantile XGBoost, Poisson/NegBin (GLM and XGBoost), logistic
  threshold models, tabular MLP, equal-weight top-3 blend, plus Platt/isotonic and conformal/PIT
  calibrators with nested walk-forward settings. Selection uses season 2023 only; season 2024 is
  report-only; season 2025 is never in the input. Holdout scoring is OFF. The pre-registered rule
  is applied locally by nba/eval/ctxres_v2_eval.py (docs/CTXRES_V2.md).
notebook: nba/colab/jobs/ctxres_v2_sweep/ctxres_v2_sweep.ipynb
inputs:
  - path: data/colab/ctxres_v2/ctxres_v2.parquet
    produce: >
      uv run python -m nba.props.context_features_v2 --db nba.duckdb
      --out-dir data/colab/ctxres_v2
    depends_on: [nba.duckdb]
  - path: data/colab/ctxres_v2/feature_spec.json
    produce: >
      uv run python -m nba.props.context_features_v2 --db nba.duckdb
      --out-dir data/colab/ctxres_v2
    depends_on: [nba.duckdb]
artifacts: [best_config.json, metrics.json, oof_2024.parquet, feature_importance.json]
registry:
  model_name: ctxres_v2_sweep
  tags: {rung: 2, model_method: ctxres_v2_family_sweep, holdout_scored: false}
touches_holdout: false
preregistration_id: null
