# Dated data-quality exclusions for the forward log (append-only; never edit or delete an entry).
#
# What an entry does: it names a rule that selects market-comparison rows whose Kalshi price was not
# the price a person could have seen at prediction time. Readers of market_at_prediction,
# shadow_predictions and the parlay track record drop the selected rows from the model-vs-market
# comparison and count them ("insufficient sample" below the configured minimum). It changes no frozen
# rule in docs/FORWARD_PREREG_2026_27.md: it is a data-quality exclusion with a dated reason, like the
# "not-in-box rows excluded identically from both sides and counted" in rule 1.
#
# What it never does: it does not touch forward_predictions, forward_scores, settlement or any outcome
# score of the model's own forecasts. A forecast is only withdrawn (forward_withdrawals) when the
# forecast itself was degraded.
#
# Selection is by rule, evaluated read-only against market_asof.duckdb (python -m nba.ops.exclusions
# check), so nothing is written to a data file.
exclusions:
  - id: stale_price_2026-10-23
    reason: stale_price
    slate_date: 2026-10-23
    applies_to: [market_at_prediction, shadow_predictions, parlay_track_record, forward_monitor_vs_kalshi]
    not_applied_to: [forward_predictions, forward_scores, settle, outcome_scoring]
    # market_at_prediction rows: the NEWEST Kalshi quote behind the as-of state (game rows: ml_age_s;
    # prop rows: the minimum age_s over the rung quotes) is older than this at made_at.
    max_quote_age_s: 1800
    # shadow_predictions rows: created_at is more than max_quote_age_s after the newest full Kalshi snapshot.
    evidence: >
      data/kalshi/kalshi.duckdb has full snapshots (3,7xx tickers) at 14:21Z and 18:26Z only between
      14:21Z and 00:09Z on 2026-10-24 (a 21:47Z snapshot holds 274 tickers). The Mac slept/lost DNS
      (predict rc=5 at 12:21 and 17:05 CDT). Pretip comparator rows (latest made_at <= tip - 60 min)
      for 0022600008, 094-097 (tip 23:00Z) carry a 177 min old moneyline and 0022600098 (tip 00:00Z) a
      219 min old one; 0022600099 is 25 min old (inside the limit).
    listed_on: 2026-10-23
    authorised_by: Devin (go 2026-10-23)

# Splits: a summary that is REPORTED in two parts, nothing dropped (the rows are valid forecasts; their inputs
# differ). Append-only like the exclusions.
splits:
  - id: avg_blank_possession_inputs_2026-10-24
    applies_to: [AVG_SHADOW_LIVE_2 scored-row summaries]
    # 2026-10-24 23:00 CDT = 2026-10-25 04:00 UTC (stored timestamps are naive UTC). Scored rows whose
    # made_at is before it ran on blank 2026 possession inputs (usage and shot-zone shares 0, pace and
    # opp_drtg at defaults): incident row 2026-10-24 22:26 in docs/DECISIONS.md. The stints merge
    # (agent/steward-stints-nightly) filled 2026 possessions; Devin chose option (a), 22:48.
    split_at_utc: 2026-10-25T04:00:00
    listed_on: 2026-10-24
    authorised_by: Devin (option a, 2026-10-24)
