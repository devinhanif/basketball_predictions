# Thresholds and scan settings for nba.datamanifest (see docs/DATA_VERSIONING.md).
db_path: nba.duckdb
data_dir: data
manifest_dir: data/manifests
summary_path: docs/data_manifests/latest.json

lock_retry:            # DB held by a writer: retry with backoff, never wait forever
  max_wait_s: 30
  first_delay_s: 1.0

played_minutes: 5.0    # played = minutes >= this

thresholds:
  row_drop_frac: 0.001         # flag any row-count drop larger than this fraction
  coverage_drop: 0.02          # flag drop in game coverage (distinct games / games table)
  null_shift: 0.05             # flag |change| in overall column null rate
  null_shift_season: 0.10      # flag |change| in a per-season null rate
  asymmetry: 0.50              # |null_rate(unplayed) - null_rate(played)| => POSSIBLE LEAK
  asymmetry_old_max: 0.25      # ... and it was below this before (or the column is new)
  label_gap: 0.10              # max-min NULL rate across outcome groups => LABEL_NULL_GAP flag
  min_group_rows: 200          # ignore played/unplayed groups smaller than this

# Natural keys for tables without a declared PRIMARY KEY (duplicate counting).
natural_keys:
  player_game_stats: [game_id, player_id]
  player_availability: [source, player_id, as_of, game_id]
  prop_predictions: [run_id, game_id, player_id, stat]
parquet_key: [game_id, player_id]

# Output / log tables: fingerprinted but excluded from data_version, since they change
# on every model run (stamping them would make the version change on each registration).
exclude_from_version:
  - experiments
  - ingest_log
  - forward_predictions
  - forward_scores
  - paper_trades
  - prop_predictions

# NULL_SHIFT is advisory (check exit 3, export proceeds) except on these core input tables, where it
# is a hard stop (exit 1; Devin 2026-10-27, DECISIONS 6d9774a). Shell-style wildcards allowed.
# No lineups table exists in nba.duckdb today (lineups are parquet under data/lineups); the pattern
# covers one if it is added or scanned via --parquet.
hard_null_shift_tables:
  - games
  - player_game_stats
  - player_availability
  - "*lineups*"

# Columns whose played/unplayed NULL asymmetry is structural (reviewed, not a leak),
# as "table.column" (shell-style wildcards allowed). Keep this list short and justified.
# forward_*scores*: the live score tables get a row for every forecast before tip and are filled by
# settlement, so y / crps / pit are NULL for every not-yet-played row by construction. They are outputs,
# never features (2026-10-23: 23 POSSIBLE_LEAK flags made data_check exit 1 every morning).
known_asymmetry:
  # only the columns settlement fills (review 2026-10-24 R2: a whole-table wildcard hid forecast-time columns)
  - "forward_*scores*.y"
  - "forward_*scores*.crps*"
  - "forward_scores_elig.pit_*"
  - "forward_scores_elig.pinball19"
  - "forward_scores_elig.rps"
  - "forward_scores_elig.q10"   # copied from pred at settlement (nba/daily/settle.py:405)
  - "forward_scores_elig.q90"

# Label-group NULL check (N7): NULL rate per minutes bucket (tables with player-game rows) and per
# configured outcome expression over t.* (table -> SQL). Seasons after label_max_season are
# excluded (2025 is the frozen holdout). Reviewed structural gaps go in known_label_gap as
# "table.column" with a written reason; the archivist never adds to it.
label_max_season: 2024
label_groups:
  games: "CASE WHEN home_pts > away_pts THEN 'home_win' WHEN home_pts < away_pts THEN 'away_win' END"
known_label_gap: []
