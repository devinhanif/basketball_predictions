# Parlay / EV engine config. No rate is hardcoded in nba/parlay; everything below is read from here.
fee_model:
  name: kalshi_fee_schedule
  # fee = ceil_to_cent(M * coefficient * contracts * P * (1 - P)), P = price in dollars,
  # rounded UP once per ORDER (not per contract). M = per-market fee multiplier (below).
  formula: p_one_minus_p
  coefficient: 0.07           # taker
  maker_coefficient: 0.0175   # maker (25% of taker); informational alternative only
  verified: true
  source: "user-provided from Kalshi published fee schedule, 2026-10-08"
  default_multiplier: 1.0
  # Longest matching series-ticker prefix wins; unlisted series use default_multiplier.
  fee_multiplier: {}
  # e.g. fee_multiplier: {KXNBAGAME: 0.5}
  default_order_type: taker   # we price at the ask; maker would rest at a better price w/ fill risk
engine:
  default: gaussian_copula        # independence | gaussian_copula | t_copula | possession_sim
  n_sims: 20000
  t_df: 6.0
  seed: 20261008
  corr_shrink_k: 200.0            # pseudo-count shrinking pairwise rho toward 0
interval:
  alpha: 0.20                     # 80% interval
  calibration_logit_sd: 0.15      # extra marginal uncertainty on the logit scale
  n_draws: 4000
market_prior:
  k: 100.0                        # weight = n_settled / (n_settled + k), gated by skill
sizing:
  kelly_fraction: 0.25
  kelly_cap: 0.02                 # informational stake cap as bankroll fraction
min_settled_for_claims: 30
