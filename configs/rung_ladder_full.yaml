# Template experiment config for a real multi-season backtest against the
# project's DuckDB file. Fill in a real holdout_season (the most recent
# full season) before running against production data; it must never be
# changed based on what improves the metrics (CLAUDE.md "frozen final
# holdout").
seed: 42
use_fixture: false
db_path: nba.duckdb
holdout_season: 2025    # 2025-26 = most recent full season; frozen, never tuned on
min_train_games: 200    # require a real minimum training sample before testing
n_boot: 2000
report_path: registry_store/reports/rung_ladder_full_report.md
