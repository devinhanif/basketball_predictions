# JARVIS (paper, alert-only) settings. DECISIONS 2026-10-25 14:41 / 14:43. Nothing here is a credential;
# the only secret JARVIS ever reads is the iMessage recipient, from the env var JARVIS_IMESSAGE_TO
# (never in this file, the repo, a log or a test). Fees for Kalshi come from configs/parlay.yaml
# (fee_model); Polymarket's come from the block below. No rate is hardcoded in nba/jarvis.

bankroll_usd:                   # Devin 2026-10-25: $35 on Kalshi, $35 on Polymarket
  kalshi: 35.0
  polymarket: 35.0

balance:                        # Devin updates current_usd by hand (docs/TRADING_CONTEXT.md)
  start_usd: 70.0               # Kalshi $35 + Polymarket US $35
  current_usd: 93.00            # 2026-10-26 morning, Devin reported total $93 (split not given)
  floor_usd: 20.0               # at or below the floor JARVIS is PAPER-ONLY until Devin resets it

caps:
  nightly_usd: 20.0             # nightly loss cap (all plays, one ET date)
  reserve_for_strong_usd: 10.0  # none/thin/arb_candidate/daily dollar may use only nightly - reserve
  per_bet_usd: 10.0             # hard ceiling for any single play (both legs of an arbitrage together)
  per_label_usd: {arbitrage: 10.0, strong: 5.0, thin: 3.0, none: 1.0, arb_candidate: 3.0}
  min_bet_usd: 1.0

sizing:
  # Stake ladder from docs/TRADING_CONTEXT.md (monotone in the label): none $1 (at most 2 contracts), thin $3,
  # strong $5, arbitrage $10. An unconfirmed arbitrage candidate is sized as thin. The label is the edge;
  # a bigger measured edge inside a label does not buy a bigger stake.
  ladder_usd: {none: 1.0, thin: 3.0, strong: 5.0, arbitrage: 10.0, arb_candidate: 3.0}
  none_max_contracts: 2

kill_switch:                    # closing-line value is the judge of the labels (TRADING_CONTEXT.md)
  min_bets: 30                  # over the last N settled JARVIS bets with a two-sided close
  # mean CLV < 0  ->  every stake drops to the "none" size until Devin fixes the labels. No losing-streak rule.

labels:                         # the label is computed from data (cents vs Pinnacle no-vig, after fee)
  strong_cents: 3.0             # strong: edge >= this; thin: 0 <= edge < this; none: edge < 0
  arbitrage_min_cents: 0.0      # an arbitrage candidate: cover cost below $1 after fees on BOTH legs
  devig: proportional           # Pinnacle no-vig method (the capture stores the same one)
  # edges are priced with the fee on a ONE-contract order (Kalshi rounds the order fee up to the cent),
  # which is conservative for larger orders.

freshness:
  max_quote_age_min: 30         # a tradable quote older than this is not offered as a play
  max_alert_quote_age_min: 5    # a quote older than this cannot carry a strong label (capped at thin)
  max_ref_age_min: 120          # a Pinnacle reference older than this caps the label at "thin"
  max_ref_lead_min: 2           # Pinnacle read more than this much NEWER than the quote: capped at thin
  min_minutes_to_tip: 3         # never emit a play for a game this close to (or past) tip
  confirmed_max_gap_s: 5        # an arbitrage needs both legs confirmed, read at most this far apart, with depth

settlement:                     # unverified rules are said out loud on every cross-venue play
  settlement_rules_verified: false      # postponement / overtime / void rules equal on both venues
  kalshi_prop_dnp_rule_verified: false  # how Kalshi settles a player prop when the player does not play
  # while the DNP rule is unverified, a prop's fair price is Pinnacle's P(over | plays) x P(plays) (our model),
  # and without a model P(plays) the prop label is capped at thin.

fees:
  # Kalshi: configs/parlay.yaml fee_model (verified, Devin 2026-10-08). Polymarket US: the verified object
  # from configs/fastarb.yaml (agent/market-fast-arb 7ce3be0), docs.polymarket.us/fees.md: fee = 0.0695 x C x
  # p x (1 - p), banker's rounding to $0.01 per order; it agrees with the feeCoefficient on every NBA market
  # in the live gateway payload (a market whose own coefficient differs is skipped). Maker rebates ignored.
  polymarket:
    name: polymarket_us_standard_taker
    formula: p_one_minus_p
    coefficient: 0.0695
    maker_coefficient: 0.0
    rounding: bankers_cent
    verified: true
    source: "docs.polymarket.us/fees.md, read 2026-10-25 (effective 2026-10-19 13:00 ET); see configs/fastarb.yaml"

polymarket:                     # Polymarket US public gateway, GET only, no key. polymarket.com (gamma) is not used.
  gateway_base: https://gateway.polymarket.us
  timeout_s: 15
  enabled: true

delivery:
  sinks: [discord]              # discord (default) and/or imessage (optional)
  discord_env_var: JARVIS_DISCORD_WEBHOOK   # the NAME of the variable; the URL is never in the repo, a log or an error
  env_var: JARVIS_IMESSAGE_TO   # iMessage sink (optional): the NAME of the variable
  dedupe_minutes: 30
  max_attempts_per_key: 3       # failed/partial sends per key per slate date before JARVIS gives up
  realert_edge_cents: 1.0       # an already-alerted play alerts again only if its edge moved this much (or its label upgraded)
  slate_lead_min: 90            # pre-tip slate preview: the first watch tick at or inside T-90 (+2 min) of the first tip
  max_chars_discord: 1800       # a Discord message holds 2000
  max_chars_imessage: 480       # phone-length
  max_texts: 3                  # hard ceiling on messages per post
  display_tz: America/Chicago   # times shown to Devin
  alert_labels: [arbitrage, strong]    # arb_candidate never alerts
  alert_when_cap_used: true     # strong/arbitrage still post when the nightly cap is used (stake shows $0)
  recap_after_et_hour: 8        # the morning recap posts once, at the first tick after this ET hour
  halftime_checkins: true

model_weights:                  # model weight by stat, earned from the closing-line record
  # FROZEN 2026-10-25, BEFORE ANY DATA EXISTS (Devin's approval, same day). This is a PAPER-ONLY ADAPTATION
  # of JARVIS's own fair price, NOT a frozen test: it never changes the scoring, rule or window of any frozen
  # rule (docs/FORWARD_PREREG_2026_27.md), and no claim is made from it. Rules, fixed here and not edited
  # after a result is seen:
  #   fair = Pinnacle_no_vig + w_stat x (model - Pinnacle_no_vig); w starts at 0 for every stat
  #   (so behaviour is unchanged until the record earns a weight) and stays in [0, w_max].
  #   Weekly (at most once per 7 days), per stat, over settled single-leg JARVIS plays whose model was
  #   LEANING (model fair > Pinnacle fair for the bought side) and that have a two-sided close:
  #     n >= min_n AND distinct dates >= min_dates, else HOLD;
  #     mean CLV > 0 AND date-clustered ci_level lower bound > 0   ->  w += step  (cap w_max)
  #     mean CLV < 0                                               ->  w -= step  (floor 0)
  #     otherwise HOLD.
  #   Every evaluation (change or hold) is appended to log with n, the CI and the date, and posted in the
  #   morning recap. Stats: pts, reb, ast, fg3m, combos, win.
  w_max: 0.5
  step: 0.1
  min_n: 30
  min_dates: 10
  ci_level: 0.80
  min_days_between_updates: 7
  log: data/jarvis/model_weights.jsonl

ingame:                         # live situations from the live capture (nba/jarvis/ingame.py): facts, not edges
  enabled: true
  lookback_min: 15              # snapshots read per tick (the capture writes about one a minute)
  snapshot_max_age_min: 5       # a newer-than-this ESPN snapshot is required, else the feed is stale and silent
  kalshi_max_age_min: 5         # same for the captured Kalshi ladders
  margin_benched: 15            # BENCHED / BENCH WINDOW: Q4 and a lead of at least this ...
  # FROZEN 2026-10-25 after the adversary's in-sample replay of 12 dense games: the first rule (Q3 under 3:00
  # allowed) flagged 75 starters and 47% played again (28-66%); Q4-only with <= 6:00 left flagged 46 and 1
  # returned (2%). That 1-in-46 is IN-SAMPLE (the rule was chosen on it), so it is judged FORWARD: the morning
  # recap counts BENCHED flagged vs returned each night. The wording is 'may be done', never certain.
  benched_max_clock_s: 360      # ... and at most this much game clock left in the 4th (overtime counts)
  min_snapshots: 2              # a starter's MIN unchanged across at least this many snapshots ...
  frozen_game_s: 180            # ... spanning at least this much GAME clock
  foul_starter_pf: 5            # FOUL TROUBLE: a starter with this many fouls, or ...
  foul_early_pf: 4              # ... this many before the 4th quarter
  margin_back: 10               # STARTERS BACK (after a BENCHED post): lead under this ...
  back_min_remaining_s: 300     # ... with at least this long left
  max_window_lines: 4

daily_dollar:                   # one $1 same-team long-shot ticket a day (TRADING_CONTEXT.md)
  enabled: true
  stake_usd: 1.0
  target_multiple: [50, 300]    # payout / cost
  max_legs: 3
  top_players: 2                # legs are the win plus points (and the top player's assists) of the team's top-usage players
  min_possessions: 50           # a player needs this many offensive possessions on court (2026) to rank by usage
  # fair = product of the single-leg fair prices x corr_factor. The factor is an ESTIMATE, not measured on a
  # combo price: same-player legs hit 28.6% vs 20.1% (1.42x) in the project data, a team win with its own
  # star's big night is assumed weaker. Buy only at or below fair.
  corr_factor: 1.2
  corr_factor_is_estimate: true

exit_warning:                   # DON'T SELL line when a position's bid is far below its value (Devin, 2026-10-25: a $0 cash-out)
  # Chosen, not fitted. Honest scope (adversary review 2026-10-26): on a sane two-sided book this only measures
  # how wide the spread is (bid < ask/3), and it is NOT a value estimate: with the gates below it fired on
  # 6.7% (95% CI 5.7-7.7, 7 nights) of sane two-sided in-game side-snapshots, all at mids under 25c (round-2
  # review; 15.7% before the gates), i.e. widened long-shot books. Treat it as "check the app", never as proof of mispricing. What it does catch: a posted bid
  # under half the mid, and (separately) "no bid posted: a sale gets $0". The case that actually hurt, a combo
  # whose legs all hit, has no market here; use `exit-check --legs-hit N --legs-total M` (or --fair).
  # Empty sides (bid 0.00 / ask 1.00) and books wider than max_spread print no fair at all.
  # Read-only text. It never suggests an order and never places one.
  enabled: true
  bid_fraction: 0.5             # warn when bid < this x fair (Devin's example)
  min_fair: 0.05                # below 5c a bid of 0 is not news
  min_giveaway_usd: 0.10        # when the contract count is known, ignore gives-away under this
  max_spread: 0.25              # no venue-mid "fair" from a book wider than this (Devin's call to change)
  max_age_min: 20               # snapshots arrive about every 15 min (p50 15.3, p99 73): older is suppressed

paths:
  paper_book: data/jarvis/paper_book.duckdb
  fan_knowledge: docs/FAN_KNOWLEDGE.md
  nba_db: nba.duckdb
  kalshi_db: data/kalshi/kalshi.duckdb
  market_db: data/markets/market_asof.duckdb
  lineups_db: data/lineups/lineups.duckdb

llm:                            # local Ollama only (qwen2.5:3b default); falls back to template text
  enabled: true
  timeout_s: 90
  max_sentences: 2
