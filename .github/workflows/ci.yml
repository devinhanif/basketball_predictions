name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"
  PYTHON_VERSION: "3.12"

jobs:
  lint-type:
    name: lint-type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check nba/ research/ tests/
      - name: ruff format --check
        run: uv run ruff format --check nba/ research/ tests/
      - name: mypy
        run: uv run mypy nba/ research/

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: pytest with coverage gate (70% ratchet floor)
        # torch (rung-4 step-heads) and lightgbm (rung-2) each bundle their own
        # OpenMP runtime and DEADLOCK when both run real training in one process.
        # Isolate the rung-4 torch tests in a second invocation; accumulate
        # coverage across both (--cov-append) and enforce the 70% gate once.
        run: |
          uv run pytest --ignore=tests/research/models/test_rung4_stepheads.py --cov-fail-under=0
          uv run pytest tests/research/models/test_rung4_stepheads.py --cov-append --cov-fail-under=0
          uv run coverage report --fail-under=70

  data-contract:
    name: data-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Schema + fixture-coverage + no-leakage + possession-reconciliation tests
        run: make data-contract

  smoke-backtest:
    name: smoke-backtest
    runs-on: ubuntu-latest
    needs: [lint-type, unit, data-contract]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      # <3-minute wall-clock budget on the run itself (CLAUDE.md
      # "smoke-backtest"), not on dependency installation above.
      - name: Full train -> backtest -> report -> register path on the fixture
        timeout-minutes: 3
        run: make smoke-check

  model-gate:
    name: model-gate
    runs-on: ubuntu-latest
    needs: [lint-type, unit, data-contract]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            gated:
              - 'nba/models/**'
              - 'nba/props/**'
              - 'nba/parlay/**'
      - uses: astral-sh/setup-uv@v7
        if: steps.changes.outputs.gated == 'true'
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.gated == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        if: steps.changes.outputs.gated == 'true'
        run: uv sync --extra dev
      - name: Compare candidate fixture metrics vs. committed production baseline
        if: steps.changes.outputs.gated == 'true'
        run: make gate
