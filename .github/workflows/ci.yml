name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Full (slow) suite with the coverage ratchet runs nightly and on demand, never blocking a push.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only. On main every push used to cancel the previous run, so 35 of
  # the last 40 runs ended "cancelled" and none finished green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.5.11"
  PYTHON_VERSION: "3.12"

jobs:
  lint-type:
    name: lint-type
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check nba/ research/ tests/
      - name: ruff format --check
        run: uv run ruff format --check nba/ research/ tests/
      - name: mypy
        run: uv run mypy nba/ research/

  unit:
    # The FAST set: everything not marked `slow` (pyproject.toml markers), no coverage gate.
    # Same command as `make test-fast`. The full suite + 70% ratchet is the `unit-full` job.
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # tests/research/pplay_minutes_valid verify the frozen rule against its prereg commit
          # text and first-commit sha in git history; a shallow clone has neither.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: pytest, fast set (not slow), no coverage gate
        run: make test-fast

  unit-full:
    # Full truth (same as `make test`): both pytest invocations + the 70% coverage ratchet.
    # Nightly / manual only, and non-blocking: a slow or flaky full run never hides a green fast run.
    name: unit-full
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: pytest, full suite with coverage gate (70% ratchet floor)
        # torch (rung-4 step-heads) and lightgbm (rung-2) each bundle their own
        # OpenMP runtime and DEADLOCK when both run real training in one process.
        # `make test` isolates the rung-4 torch tests in a second invocation and enforces
        # the 70% gate once on the combined coverage.
        run: make test

  data-contract:
    name: data-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Schema + fixture-coverage + no-leakage + possession-reconciliation tests
        run: make data-contract

  smoke-backtest:
    name: smoke-backtest
    runs-on: ubuntu-latest
    needs: [lint-type, unit, data-contract]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --extra dev
      # <3-minute wall-clock budget on the run itself (CLAUDE.md
      # "smoke-backtest"), not on dependency installation above.
      - name: Full train -> backtest -> report -> register path on the fixture
        timeout-minutes: 3
        run: make smoke-check

  model-gate:
    name: model-gate
    runs-on: ubuntu-latest
    needs: [lint-type, unit, data-contract]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            gated:
              - 'nba/models/**'
              - 'nba/props/**'
              - 'nba/parlay/**'
      - uses: astral-sh/setup-uv@v7
        if: steps.changes.outputs.gated == 'true'
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.gated == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        if: steps.changes.outputs.gated == 'true'
        run: uv sync --extra dev
      - name: Compare candidate fixture metrics vs. committed production baseline
        if: steps.changes.outputs.gated == 'true'
        run: make gate
