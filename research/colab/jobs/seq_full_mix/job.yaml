name: seq_full_mix
description: >
  SEQ_FULL_MIX rule (docs/prereg/SEQ_FULL_MIX.md, must be FROZEN with a committed Devin-confirmed
  HOLDOUT_ACCESS_LOG row): the ENSEMBLE E2 sequence-transformer walk-forward extended over 2023, 2024
  AND 2025 (warm refit before each month on every strictly earlier row, so earlier 2025 months' outcomes
  are training labels), plus the past-only placebo E2P and the shuffled-input guard E2S. Three programs,
  3 seeds, full budgets; about 15 minutes on a T4. Refuses unless the staged rule sha matches and the
  staged holdout log has the row. It scores nothing; scoring is one run on the Mac.
notebook: research/colab/jobs/seq_full_mix/seq_full_mix.ipynb
inputs:
  - path: data/colab/seq_full_mix/seq_ensemble_cur25.npz
    produce: uv run python -m research.features.seq_full_mix_export export
    depends_on: [nba.duckdb]
  - path: docs/prereg/SEQ_FULL_MIX.md
  - path: docs/HOLDOUT_ACCESS_LOG.md
artifacts:
  - metrics.json
  - config.json
  - oof_E2.npz
  - oof_E2P.npz
  - oof_E2S.npz
registry:
  model_name: seq_full_mix
  tags: {rung: 3, model_method: seq_transformer_quantile_walkforward, holdout_scored: false}
touches_holdout: true
preregistration_id: SEQ_FULL_MIX
