name: seq_props
description: >
  GPU sequence model for player props: transformer over each player's last 20 team games
  (missed games kept as absent tokens) plus pre-tip context, predicting 19 monotone quantiles
  and a mean for pts/reb/ast/fg3m as a residual over the recency mean. Trains through the 2023
  season (early stop on a time-ordered 2023 slice) and predicts the 2024 season. BUDGET env
  NBA_BUDGET=fast (default, ~10-15 min on a T4) or full (GRU arm, 3 seeds, walk-forward refits).
  Season 2025 is never in the input and holdout scoring is OFF.
notebook: research/colab/jobs/seq_props/seq_props.ipynb
inputs:
  - path: data/colab/seq_props/seq_props.npz
    produce: >
      uv run python -m research.features.player_sequences --db nba.duckdb --out data/colab/seq_props
    depends_on: [nba.duckdb]
artifacts: [weights.pt, config.json, metrics.json, oof_2024.parquet]
registry:
  model_name: seq_props
  tags: {rung: 3, model_method: seq_transformer_quantile, holdout_scored: false}
touches_holdout: false
preregistration_id: null
