name: ctxres_v2_sweep
description: >
  Context-residual v2 model-family sweep on a Colab T4 (single NBA_BUDGET knob: full is the default,
  EXPERIMENT 2, strict, every arm must finish, about 65-85 min; fast ~30-35 min measured; a staged completion_prev.json switches the notebook to the
  ~9 min COMPLETION step). Arms: production-config LightGBM (v1_prod),
  XGBoost residual (v1 / v1+v2 features, production config vs Optuna-tuned), season-relative and
  pruned feature variants, multi-quantile XGBoost, Poisson/NegBin (GLM and XGBoost), logistic
  threshold models, tabular MLP, equal-weight top-3 blend, plus Platt/isotonic and conformal/PIT
  calibrators with nested walk-forward settings. Selection uses season 2023 only; season 2024 is
  report-only; season 2025 is never in the input. Holdout scoring is OFF. The pre-registered rule
  is applied locally by research/eval/ctxres_v2_eval.py (docs/CTXRES_V2.md).
notebook: research/colab/jobs/ctxres_v2_sweep/ctxres_v2_sweep.ipynb
inputs:
  - path: data/colab/ctxres_v2/ctxres_v2.parquet
    produce: >
      uv run python -m research.props.context_features_v2 --db nba.duckdb
      --out-dir data/colab/ctxres_v2
    depends_on: [nba.duckdb]
  - path: data/colab/ctxres_v2/feature_spec.json
    produce: >
      uv run python -m research.props.context_features_v2 --db nba.duckdb
      --out-dir data/colab/ctxres_v2
    depends_on: [nba.duckdb]
  - path: data/colab/ctxres_v2/completion_prev.json
    # `{}` for a normal sweep. To run the COMPLETION step (no search/selection; refit only the
    # listed arms with the configs chosen on 2023) stage the plan first, then push:
    #   uv run python -m research.eval.ctxres_v2_eval --stage-completion <first run dir>
    produce: >
      uv run python -m research.eval.ctxres_v2_eval --stage-completion
artifacts: [best_config.json, metrics.json, oof, feature_importance.json]
registry:
  model_name: ctxres_v2_sweep
  tags: {rung: 2, model_method: ctxres_v2_family_sweep, holdout_scored: false, experiment: 2, family: ctxres_v2_exp2_full_breadth}
touches_holdout: false
preregistration_id: null
